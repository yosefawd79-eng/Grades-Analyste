<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Analysis Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #F4F6FA;
        }

        .analyzer-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: rgb(176, 144, 239);
            color: #F4F6FA;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(77, 77, 110);
        }

        .report {
            margin-top: 15px;
            padding: 15px;
            background: #eef1f7;
            border-radius: 5px;
            display: none;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="analyzer-box">

        <h3>محلل درجات الطالب</h3>

        <label>الدرجة الأولى:</label>
        <input type="number" id="grade1" placeholder="مثال: 85">

        <label>الدرجة الثانية:</label>
        <input type="number" id="grade2" placeholder="مثال: 90">

        <label>الدرجة الثالثة:</label>
        <input type="number" id="grade3" placeholder="مثال: 75">

        <label>نسبة الحضور (%):</label>
        <input type="number" id="attendance" placeholder="مثال: 80">

        <button id="analyzeBtn">تحليل النتيجة</button>

    </div>

    <div id="reportBox" class="report"></div>

    <script>

        const PASS_MARK = 50;
        const MIN_ATTENDANCE = 75;

        function getGradeLetter(average) {

            if (average >= 90) return "A";
            if (average >= 80) return "B";
            if (average >= 70) return "C";
            if (average >= 60) return "D";
            if (average >= PASS_MARK) return "E";

            return "F";
        }

        function getFinalResult(average, attendance) {

            if (average >= PASS_MARK && attendance >= MIN_ATTENDANCE) {
                return "ناجح";
            } else {
                return "راسب";
            }
        }

        document.getElementById("analyzeBtn").addEventListener("click", function () {

            const rawG1 = document.getElementById("grade1").value.trim();
            const rawG2 = document.getElementById("grade2").value.trim();
            const rawG3 = document.getElementById("grade3").value.trim();
            const rawAtt = document.getElementById("attendance").value.trim();

            const reportBox = document.getElementById("reportBox");

            if (rawG1 === "" || rawG2 === "" || rawG3 === "" || rawAtt === "") {

                reportBox.style.display = "block";
                reportBox.innerHTML = '<p class="error">الرجاء عدم ترك الخانات فارغة</p>';

                return;
            }

            const g1 = Number(rawG1);
            const g2 = Number(rawG2);
            const g3 = Number(rawG3);
            const att = Number(rawAtt);

            const grades = [g1, g2, g3];

            let total = 0;

            for (let i = 0; i < grades.length; i++) {
                total += grades[i];
            }

            const average = total / grades.length;

            const letter = getGradeLetter(average);

            const result = getFinalResult(average, att);

            reportBox.style.display = "block";

            reportBox.innerHTML = `
                <h3>تقرير الطالب:</h3>

                <p>إجمالي الدرجات: <strong>${total}</strong></p>

                <p>المتوسط: <strong>${average.toFixed(1)}</strong></p>

                <p>التقدير: <strong>${letter}</strong></p>

                <p>الحالة: <strong>${result}</strong></p>
            `;

        });

    </script>

</body>

</html>
